name: loong64
on:
  push:
    branches:
      - loong64-*
    tags:
      - release-loong64-*
  pull_request:
    branches:
      - loong64-*

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Print branch name
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.base_ref }} (PR target)"
          else
            echo ${{ github.ref_name }}
          fi
      - name: Extract rustfs branch
        id: extract
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF=${{ github.base_ref }}
          else
            REF=${{ github.ref_name }}
          fi
          echo "REF=$REF"
          RAW_VERSION=$(echo $REF | awk -F'loong64-' '{print $2}')
          echo "RAW_VERSION=$RAW_VERSION"
          echo "RAW_VERSION=$RAW_VERSION" >> ${GITHUB_ENV}
          echo "RAW_VERSION=$RAW_VERSION" >> ${GITHUB_OUTPUT}
          RUSTFS_BRANCH=$(echo $RAW_VERSION | awk -F'+' '{print $1}')
          echo "RUSTFS_BRANCH=$RUSTFS_BRANCH"
          echo "RUSTFS_BRANCH=$RUSTFS_BRANCH" >> ${GITHUB_ENV}
          echo "RUSTFS_BRANCH=$RUSTFS_BRANCH" >> ${GITHUB_OUTPUT}
          RELEASE=$(echo $RAW_VERSION | awk -F'+' '{print $2}')
          RELEASE=${RELEASE:-alpha.${{ github.run_number }}}
          echo "RELEASE=$RELEASE"
          echo "RELEASE=$RELEASE" >> ${GITHUB_ENV}
          echo "RELEASE=$RELEASE" >> ${GITHUB_OUTPUT}
          if echo "$RAW_VERSION" | grep -qE '[+].*(alpha|beta|rc)'; then
            IS_STABLE=false
          else
            IS_STABLE=true
          fi
          echo "IS_STABLE=$IS_STABLE"
          echo "IS_STABLE=$IS_STABLE" >> ${GITHUB_OUTPUT}
      - name: Install build tools
        run: |
          sudo sed -i "s#deb.debian.org#mirrors.aliyun.com#" /etc/apt/sources.list.d/debian.sources
          sudo apt update
          sudo apt install -y git make file rustup unzip build-essential protobuf-compiler
      - name: Configure cargo mirror
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << EOF
          [source.crates-io]
          replace-with = 'ustc'

          [source.ustc]
          registry = "sparse+https://mirrors.ustc.edu.cn/crates.io-index/"
          EOF
      - name: Clone rustfs
        run: |
          git clone --branch ${{ env.RUSTFS_BRANCH }} --depth 1 https://github.com/rustfs/rustfs.git rustfs
      - name: ls
        run: ls -lah
      - name: Build rustfs
        working-directory: rustfs
        run: make build
      - name: Apply rustfs-cli build patch
        working-directory: rustfs
        run: git apply ../cli.diff
      - name: Build rustfs-cli
        working-directory: rustfs
        run: make build-cli
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustfs-loong64-binaries-${{ env.RUSTFS_BRANCH }}-build-${{ github.run_number }}
          path: |
            rustfs/target/release/loongarch64-unknown-linux-gnu
